# 1100CC VirtualHost (from 1100CC SETUP.md), serving all hosts from /var/1100CC/APP
ServerName localhost

<VirtualHost *:80>
	ServerAlias *
	ServerName localhost:80

	# Get the server name from the Host: header
	UseCanonicalName Off

	# Remove line breaks
	RewriteEngine On
	RewriteRule ^(.*)(?:\r?\n|\r)(.*)? $1$2 [N]

	# Set document root
	DocumentRoot /var/1100CC/APP

	# 1100CC mapping
	RewriteMap alias txt:/var/1100CC/APP/alias

	# production (default) or development (display errors)
	SetEnv STATE ${APP_STATE}

	<Directory /var/1100CC/APP>
		Options -Indexes +FollowSymLinks
		AllowOverride All
		Require all granted
	</Directory>

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
