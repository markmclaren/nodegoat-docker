name: nodegoat

services:
  db:
    build:
      context: .
      target: db
    restart: unless-stopped
    env_file: .env
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  web:
    build:
      context: .
      target: web
      args:
        WITH_GRAPH_ANALYSIS: ${WITH_GRAPH_ANALYSIS:-0}
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - storage:/var/1100CC/APP/STORAGE

volumes:
  db-data:
  storage:
