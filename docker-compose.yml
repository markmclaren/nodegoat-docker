name: nodegoat

services:
  db:
    build:
      context: .
      target: db
    restart: unless-stopped
    env_file: .env
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  web:
    build:
      context: .
      target: web
      args:
        WITH_GRAPH_ANALYSIS: ${WITH_GRAPH_ANALYSIS:-0}
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      HTTP_PORT: ${HTTP_PORT:-80}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - storage:/var/1100CC/APP/STORAGE
    # Also a Jobs heartbeat: every request (re)starts the scheduled Jobs process if needed
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "-H", "Host: nodegoat.localhost", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  db-data:
  storage:
